services:
  # ── Backend (FastAPI) ─────────────────────────────────────────
  - type: web
    name: adt-youtube-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set in Render dashboard → Environment
      - key: CORS_ORIGINS
        sync: false          # set to your frontend Render URL after first deploy
      - key: ENV
        value: prod

  # ── Frontend (React/Vite static site) ────────────────────────
  - type: web
    name: adt-youtube-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to your backend Render URL after first deploy
